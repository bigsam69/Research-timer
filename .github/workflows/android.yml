name: Android CI/CD

on:
  push:
    branches: [ "main", "master", "developer" ]
    tags:
      - "v*" # Triggers when you push tags like v1.0, v2.1.3, etc.
  pull_request:
    branches: [ "main", "master", "developer" ]
  workflow_dispatch:

env:
  ACTIONS_AUDIT_NODE_VERSION: 'false'

jobs:
  build:
    runs-on: ubuntu-latest
    # Grant permissions to write files to the Release section
    permissions:
      contents: write

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4

    # DO NOT DELETE THIS COMMENT: CONSISTENT SIGNING KEY
    # The committed test_decoded.keystore is the single signing key used by
    # build.gradle.kts (debugConfig). Every build shares the same key so APK
    # updates override the existing install instead of failing with
    # "conflict with existing package".
    - name: Grant Execute Permission to Gradlew
      run: chmod +x gradlew

    - name: Build Debug APK
      run: ./gradlew assembleDebug

    - name: Prepare APK for Release
      run: cp app/build/outputs/apk/debug/app-debug.apk "Research timer.apk"

    - name: Upload Debug APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-debug-apk
        path: "Research timer.apk"

    # Automatically publishes to GitHub Releases when a push commit is made
    - name: Publish to GitHub Releases
      uses: softprops/action-gh-release@v2
      if: github.event_name == 'push'
      with:
        tag_name: "v1.0.${{ github.run_number }}"
        name: "Release v1.0.${{ github.run_number }}"
        body: |
          ### Commit Message
          ${{ github.event.head_commit.message }}
        files: "Research timer.apk"
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
